# hive profile: all 6 @hive plugins + the Berget pairing (dsh-berget-refresh
# feeds the model credentials; dsh-berget-usage renders the seat-usage panel).
#
# Each service plugin takes an optional `directory` config: the workspace root
# that CONTAINS `.opencode/` (where the HIVE state — dreams/, hivemind/,
# painpoints — lives). It defaults to the process cwd, so when you launch dsh
# from your workspace root you can omit it entirely (as below). Set it
# explicitly only if you launch dsh from somewhere else, e.g.:
#
#    - id: dream-archive
#      name: '@hive/dsh-dream-archive'
#      config:
#        directory: /absolute/path/to/your/workspace
- insert:
    - id: dsh-berget-refresh
      name: dsh-berget-refresh
    - id: dsh-berget-usage
      name: dsh-berget-usage
    - id: dream-archive
      name: '@hive/dsh-dream-archive'
    - id: painpoints
      name: '@hive/dsh-painpoints'
    - id: hive-dream-tools
      name: '@hive/dsh-tools'
    - id: hive-agents
      name: '@hive/dsh-agents'
    - id: evolution
      name: '@hive/dsh-evolution'
    - id: hivemind
      name: '@hive/dsh-hivemind'
