# hive profile: all 6 @hive plugins.
#
# The Berget pairing is NOT hand-rows here anymore: dsh-berget-refresh,
# dsh-berget-usage and dsh-provider-usage each declare their own
# `dsh.bundle.patch`, so the kit installer (`dsh plugin add`) joins their
# rows into the profile's bundle stack automatically. NEVER re-add hand
# rows for those ids here — a bundle row and a patch row with the same id
# hard-fail the compose (duplicate loader entry id).
#
# Each @hive service plugin takes an optional `directory` config: the
# workspace root that CONTAINS `.opencode/` (where the HIVE state —
# dreams/, hivemind/, painpoints — lives). It defaults to the process
# cwd, so when you launch dsh from your workspace root you can omit it
# entirely (as below). Set it explicitly only if you launch dsh from
# somewhere else, e.g.:
#
#    - id: dream-archive
#      name: '@hive/dsh-dream-archive'
#      config:
#        directory: /absolute/path/to/your/workspace
- insert:
    - id: dream-archive
      name: '@hive/dsh-dream-archive'
    - id: painpoints
      name: '@hive/dsh-painpoints'
    - id: hive-dream-tools
      name: '@hive/dsh-tools'
    - id: hive-agents
      name: '@hive/dsh-agents'
    - id: evolution
      name: '@hive/dsh-evolution'
    - id: hivemind
      name: '@hive/dsh-hivemind'
