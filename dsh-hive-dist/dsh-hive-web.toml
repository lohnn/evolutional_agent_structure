# dsh-hive-web — the HIVE-on-dsh stack as a long-running service.
#
# TEMPLATE: copy into the TARGET machine's <workspace-root>/.opencode/services/
# and fill in the env line + the pre_start path. svcwatch (shipped by the
# evolutional_agent_structure plugin) hot-reloads it.
#
# SETUP = 5 values in the lines marked `>>> EDIT` and nothing else:
#   - DSH_WORKSPACE_ROOT  absolute path of the workspace the HIVE state
#                         (.opencode/) lives in; the plugins default their
#                         `directory` config to the process cwd, and the main
#                         command cds there before exec
#   - DSH_TRUSTED_HOST    the host name your browser actually uses (e.g. your
#                         tailnet MagicDNS name) — feeds the /api trust fence
#   - DSH_HIVE_REF        git ref the plugin cohort tracks for updates
#   - DSH_VERSION         pinned harness version — SINGLE source of truth:
#                         BOTH pre_start (svcwatch passes the service env to
#                         the hook) and the main command (bash expands
#                         ${DSH_VERSION:?...}) read it. Never float latest.
#   - pre_start path      absolute path to the kit's dsh-hive-update.sh
#                         (copy the whole dsh-hive-dist/ dir somewhere fixed,
#                         e.g. ~/.dsh/hive-kit/)
#
# Everything else has sane defaults; the only literals to touch if ports
# collide are --port 4501 here and the matching pair in dsh-hive-relay.toml.
#
# Preconditions on the target machine: Node 22+, pnpm AND git on svcwatch's
# PATH (BASE_ENV covers /usr/local/… through /usr/bin — else add a PATH= in
# env), network for the first bootstrap (harness download + git clone + 7
# tsc prepares), and a model provider credential (see README "Shared notes").
#
# Also note:
#   - The tee to /tmp/<name>.log is LOAD-BEARING: the `?token=` launch URL is
#     printed on boot and rotates per restart — fetch the fresh one there.
#   - If you run dsh-berget-refresh, BERGET_API_KEY must remain UNSET in this
#     environment (a set env var shadows the credential ref and makes its
#     ctx.credentials.set reject).
#   - Cookie continuity: restarts do NOT log cookied browsers out (the launch
#     token only mints a cookie signed by the durable secret in
#     ~/.dsh/.credentials.yaml).
#
# pre_start = plugin auto-update. Runs dsh-hive-update.sh BEFORE every
# (re)start: it (re)installs the 7-package cohort from DSH_HIVE_REF, then the
# fresh dsh web boots on it. Offline with an existing install -> keeps it and
# boots anyway; offline with NOTHING installed -> start aborts and backs off.
#   - first run bootstraps the profile scaffold from the kit dir next to the
#     script; existing files are never overwritten
#   - `restart` the service (svcwatchctl restart dsh-hive-web) to pull a new
#     ref mid-flight; the dsh version bump flows from the env line above
#   - REQUIRES a svcwatch that supports pre_start (carried by this plugin
#     version) — on a running watcher, restart svcwatch (or recreate the
#     container) once after the plugin lands
name = "dsh-hive-web"
env = { DSH_WORKSPACE_ROOT = "/home/you/your-workspace", DSH_TRUSTED_HOST = "your-host.example.net", DSH_HIVE_REF = "main", DSH_VERSION = "0.1.2-rc.1" }
pre_start = ["<path-to-kit>/dsh-hive-update.sh"]
pre_start_timeout_sec = 900
# cwd: svcwatch chdirs LITERALLY (no env expansion), so keep it relative —
# the workspace root is applied by the cd inside the command instead.
cwd = "."
command = ["bash", "-c", 'cd "${DSH_WORKSPACE_ROOT:?DSH_WORKSPACE_ROOT must be set -- see env line}" && exec pnpm dlx @deepseek-ai/dsh@${DSH_VERSION:?DSH_VERSION must be set -- see env line} --profile hive --port 4501 --no-open --trusted-host "${DSH_TRUSTED_HOST:?DSH_TRUSTED_HOST must be set -- see env line}" 2>&1 | tee /tmp/dsh-hive-web.log']
restart = "always"
restart_delay_sec = 3
backoff_max_sec = 60
start_grace_sec = 20
