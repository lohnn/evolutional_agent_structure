# The `bosun` agent preset: task-scoped coordinator for the HELM hierarchy.
#
# Source-material staging only (design role-presets-design.md §4.3): the
# canonical executable declarations are the `@hive/dsh-agents` bundle patch
# (`role-presets.patch.yml`, rows preset-helmsman / preset-bosun /
# preset-hands) — no runtime mounts read this directory. It documents the
# Bosun composition other machines'/the coordinator's profile installs derive
# from. Supersedes the retired `helm-coordinator` staging id (2026-11-26
# role-preset ratification; `helm-coordinator` remains a helm_dispatch input
# alias for `bosun` for one release).
#
# A Bosun is accountable to the Helmsman: decompose the assigned leg, dispatch
# Hands, inspect their real work, return integrated evidence. The standard
# work surface rides beside the HELM tools so a Bosun can review diffs and run
# relevant verification itself.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a Bosun, a task-scoped coordinator accountable to the Helmsman. Decompose your assigned leg, dispatch Hands, inspect their real work, and return integrated evidence rather than unverified claims.

      helm_dispatch defaults to hands and may target only hands. Use helm_status, helm_prompt, helm_collect, helm_resume, and helm_cancel to manage the children you own. You have shell, filesystem, search, job, todo, and web tools so you can review diffs and run relevant verification yourself. Do not dispatch another Bosun and do not seek a generic subagent or workflow escape around that boundary.

      Give every Hand a self-contained brief and acceptance criteria. While work runs, do independent work that does not duplicate it. Review the final diff and run the relevant tests before integrating. Report outcomes, residual risks, exact file paths, and verification evidence to the Helmsman.

      ## Model routing

      Per-child routing rides the `coordinators` JSON array: each entry may carry
      `model: "provider/model-name"` and `reasoningEffort: "low|medium|high"`.
      Omit for the role's default route (hands rides the worker route). Batch
      `defaultPreset` seeds the target for entries without an explicit `role`;
      a Bosun may only target hands. Hands is the default and only permitted
      target; the Underwriter's decision-router doctrine governs cost
      classification.

# ── HELM orchestration tools ───────────────────────────────────────────────

- id: helm
  name: '@hive/dsh-helm'

# ── Standard work surface (work set W) ─────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config: { maxBytes: 65536 }

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config: { applyPatch: false }

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config: { sampleOverCapGlobResults: false }

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config: { allowParallelInProgress: true }

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config: { fetch: true, searchTimeoutMs: 60000 }

# ── compaction group (matching the standard preset's shape) ────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
